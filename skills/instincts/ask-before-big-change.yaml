id: ask-before-big-change
name: 大改动前确认
trigger: 改动涉及冻结区、删除整个模块、修改数据库 schema 或外部公共 API 时
action: |
  仅在以下情况暂停确认：
  1. 涉及冻结区文件
  2. 删除整个模块
  3. 修改数据库 schema / 公共 API 签名
  4. 未获授权的外部写入或不可逆操作

  已有明确授权在任务内持续有效，不重复索取。

  以下情况不需要暂停，直接执行并在完成后报告：
  - 常规跨文件修改、内部重构与任务所需依赖调整
  - 已验证无调用方的死代码或重复代码清理
  - 修复 import、类型、路径等小问题
  - 补全遗漏的错误处理
evidence: |
  实战反馈：阈值太低导致 AI 每次改动都暂停等确认，
  把 1-2 轮能完成的任务拖成 5-6 轮。
  真正需要拦截的是不可逆操作，不是日常跨文件修改。
examples:
  - 修 bug 需要改 5 个文件 → 直接改，完成后报告改了什么
  - 重构函数影响 10 个调用方 → 直接改，完成后列出影响清单
  - 要删除整个 service 模块 → 暂停确认
  - 要改数据库表结构 → 暂停确认
