id: search-before-code
name: 先搜再改
trigger: 任务涉及修改已有代码、添加新功能、或需要了解项目上下文时
action: |
  动手写代码之前，先判断需要什么信息，再选择正确的搜索方式：

  1. 明确符号（函数名、类名、变量名、配置项）
     → 用 grep/glob 精确查找

  2. 语义理解（相关模块在哪、有没有可复用实现、调用链、影响范围）
     → 用代码库语义搜索（ACE 或同类工具）

  3. 外部资料（第三方库用法、API 文档、最佳实践、当前版本信息）
     → 用外部搜索（smart-search 或同类工具）

  4. 搜索完成后，确认以下信息再动手：
     - 项目里有没有类似实现可以复用
     - 改动会影响哪些文件和模块
     - 项目对这类代码的风格约定是什么
evidence: |
  AI 只看当前文件就开始写是最常见的问题来源：
  重复造轮子、破坏已有结构、风格不一致、遗漏影响范围。
  Karpathy 原则三"精准手术"的前提是知道手术区域的全貌。
examples:
  - 要加一个新的 API endpoint → 先搜已有 endpoint 的结构和约定
  - 要修一个 bug → 先搜相关函数的调用方，确认影响范围
  - 要用一个第三方库 → 先搜项目里是否已经在用，用的哪个版本
  - 要重构一个模块 → 先搜所有引用它的地方
