id: fix-and-continue
name: 小问题直接修
trigger: 执行任务过程中遇到可预见的小障碍时
action: |
  遇到以下问题时，直接修复并继续，不暂停请求确认：
  - import 错误、缺失模块引用
  - 类型不匹配、类型注解缺失
  - 路径错误、文件名拼写
  - 缺少必要的异常处理
  - 变量名/函数名拼写错误
  - 缺少必要的参数或默认值
  - 格式/缩进问题
  - 简单的逻辑错误（off-by-one、条件反转等）

  修复后在完成总结中一并说明即可。
  如果修复失败或问题超出预期范围，才停下来汇报。

  禁止暂停的场景：
  - "我发现了一个 import 错误，要不要修？" → 直接修
  - "这里缺少类型注解，要不要补？" → 直接补
  - "路径不对，要不要改？" → 直接改
evidence: |
  实战反馈：AI 遇到每个小问题都暂停请求确认，
  导致用户需要不断点击"继续"，严重拖慢工作节奏。
  这些小问题的修复是确定性的，不需要人工判断。
examples:
  - 改了函数签名导致 3 处调用报错 → 一并修好，不逐个问
  - 移动文件后 import 路径全错 → 批量修好继续
  - 发现测试文件里有个拼写错误 → 顺手修掉
